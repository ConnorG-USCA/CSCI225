<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">My Website</a>

            <ul class="navbar-nav fw-bold">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="ContactMe2026.html">Contact Me</a>
                </li>
            </ul>

        </div>
    </nav>

    <div class="container mt-5 pt-4">
    
        <div class="row g-4 align-items-start">
    
            <div class="col-12 col-lg-6">
                <div class="ratio ratio-4x3 border border-black border-4">
                    <iframe src="https://www.youtube.com/embed/jNQXAC9IVRw" title="Me at the zoo" allowfullscreen>
                    </iframe>
                </div>
            </div>
    
            <div class="col-12 col-lg-6">
                <form class="border rounded p-4 mb-4 shadow-sm" name="feedback">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="fname" name="fname" placeholder="First Name" required>
                        <label for="fname">First Name</label>
                    </div>
                                    
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="lname" name="lname" placeholder="Last Name" required>
                        <label for="lname">Last Name</label>
                    </div>

                    <div class="mb-3">
                    
                        <label for="mail" class="form-label">Email:</label>
                    
                        <input type="email" class="form-control" id="mail" name="mail" placeholder="name@domain.com" required>
                    
                        <small class="form-text text-muted">
                            Your email will not be shared with anyone else.
                        </small>
                    
                    </div>
                                    
                    <p>Would you recommend this website?</p>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="yes" name="recommend" value="yes">
                        <label class="form-check-label" for="yes">
                            Yes
                        </label>
                    
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="no" name="recommend" value="no">
                        <label class="form-check-label" for="no">
                            No
                        </label>
                    </div>
                    
                    <br>
                    
                    <label for="favorite" class="form-label">
                        Favorite Website:
                    </label>
                    <select class="form-select" id="favorite" name="favorite">
                        <option value="google">Google</option>
                        <option value="facebook">Facebook</option>
                        <option value="instagram">Instagram</option>
                        <option value="x">X</option>
                    </select>

                    <br>
                    
                    <label for="color">Favorite Color:</label>
                    <input type="color" class="form-control form-control-color" id="color" name="color">
                    
                    <br>

                    <label for="date">Today's Date:</label>
                    <input type="date" class="form-control" id="date" name="date">                    
                    
                    <br>

                    <p>Rate this website (1-10):</p>
                    <input type="range" class="form-range" name="rating" min="1" max="10" value="10">       
                    
                    <br>

                    <label for="password">Password:</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password">
                    
                    <br>
                    
                    <label for="comment" class="form-label">
                        Additional Comments:
                    </label>
                    <textarea class="form-control" id="comment" name="comment"></textarea>
                    
                    <br>

                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
    
        </div>
    
    </div>

    <body>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>

    <div class="container">
        <div class="row">
            <div class="col">
            </div>
        </div>
    </div>
