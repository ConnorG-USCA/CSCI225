<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>

    <iframe 
        width="946" 
        height="710" 
        src="https://www.youtube.com/embed/jNQXAC9IVRw" 
        title="Me at the zoo" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen>
    </iframe>

    <form name="feedback">
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" placeholder="anonymous" required>
        
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" placeholder="anonymous" required>
        
        <label for="email">Email:</label>
        <input type="email" id="mail" name="mail" placeholder="name@domain.com" required>
        
        <p>Would you recommend this website?</p>
        <input type="radio" id="yes" name="recommend" value="yes">
        <label for="yes">Yes</label>

        <input type="radio" id="no" name="recommend" value="no">
        <label for="no">No</label>
        
        <p>Favorite Website:</p>
        <select name="favorite">
            <option value="google">Google</option> 
            <option value="facebook">Facebook</option> 
            <option value="instagram">Instagram</option> 
            <option value="x">X</option>
        </select>

        <br>
        <label for="color">Favorite Color:</label>
        <input type="color" id="color" name="color">
        
        <label for="date">Today's Date:</label>
        <input type="date" id="date" name="date">

        <br>
        <p>Rate this website (1-10):</p>
        <input type="range" name="rating" min="1" max="10">

        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password">
        
        <p>Additional Comments:</p>
        <textarea name="comment"></textarea>
        
        <br>
        <input type="submit" name="submit" value="Submit">
    </form>

    <body>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
